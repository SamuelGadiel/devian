name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout devian
        uses: actions/checkout@v5

      - name: Setup Java (temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Setup SSH (Bitbucket)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BITBUCKET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan bitbucket.org >> ~/.ssh/known_hosts
          git config --global user.name "SamuelGadiel"
          git config --global user.email "samuelgadiel@gmail.com"

      - name: Clone sisvisa-serr-mobile (develop)
        run: |
          git clone --depth 1 -b develop git@bitbucket.org:branef/sisvisa-serr-mobile.git app

      # ---- Caches ----
      # FVM: cada .fvmrc gera cache próprio (multi-versões). restore-keys genérico
      # "fvm-" permite reaproveitar cache de QUALQUER versão anterior quando o
      # projeto muda de Flutter (fvm install só baixa o delta).
      - name: Cache FVM + pub
        uses: actions/cache@v5
        with:
          path: |
            ~/fvm/versions
            ~/.pub-cache
          key: fvm-${{ hashFiles('app/.fvmrc') }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            fvm-${{ hashFiles('app/.fvmrc') }}-
            fvm-

      # Gradle: deps + wrapper + build cache (~/.gradle). Maior ganho em builds repetidos.
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            gradle-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}-
            gradle-

      # Android NDK: cacheia SOMENTE a versão que o build usa (extraída do
      # build.gradle). Cachear /ndk inteiro inclui os NDKs pré-instalados do
      # runner (dono root) e o restore quebra com "Cannot utime: Operation not
      # permitted" (tar tenta sobrescrever arquivos do sistema).
      - name: Extract NDK version
        run: |
          NDK=$(grep -hoP 'ndkVersion\s*=\s*"\K[^"]+' app/android/app/build.gradle.kts app/android/app/build.gradle 2>/dev/null | head -1)
          if [ -z "$NDK" ]; then NDK="26.1.10909125"; fi
          echo "NDK_VERSION=$NDK" >> $GITHUB_ENV
          echo "NDK_VERSION=$NDK"

      - name: Cache Android NDK (versão do build.gradle)
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}
          restore-keys: |
            android-ndk-

      - name: Install Flutter (FVM, usa .fvmrc)
        working-directory: app
        run: fvm install

      # Licenças + pré-instalação do NDK/CMake via sdkmanager ANTES do build,
      # para o Gradle encontrar tudo pronto (em vez de instalar no meio do build).
      - name: Accept licenses + Install NDK/CMake
        run: |
          SDKMANAGER=""
          for d in "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/cmdline-tools" /usr/local/lib/android/sdk/cmdline-tools/latest/bin; do
            if [ -f "$d/sdkmanager" ]; then SDKMANAGER="$d/sdkmanager"; break; fi
          done
          echo "sdkmanager: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
            # NDK: extrai a versão do build.gradle (robusto a mudanças futuras)
            NDK=$(grep -hoP 'ndkVersion\s*=\s*"\K[^"]+' app/android/app/build.gradle.kts app/android/app/build.gradle 2>/dev/null | head -1)
            if [ -n "$NDK" ]; then
              echo "Instalando NDK $NDK..."
              "$SDKMANAGER" "ndk;$NDK" > /dev/null 2>&1 || true
            fi
            # CMake: default do Flutter
            echo "Instalando CMake 3.22.1..."
            "$SDKMANAGER" "cmake;3.22.1" > /dev/null 2>&1 || true
          else
            echo "sdkmanager não encontrado; tentando via flutter"
            yes | fvm flutter doctor --android-licenses > /dev/null 2>&1 || true
          fi

      - name: Pub get
        working-directory: app
        run: fvm flutter pub get

      - name: Build APK release
        working-directory: app
        run: fvm flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: sisvisa-serr-mobile-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
